name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (starts with 'untagged-')
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: target/release/tongue-emulation.exe
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ inputs.tag }}' target/release/tongue-emulation.exe
