name: Release
on:
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Attest
        uses: actions/attest@v4
        with:
          subject-path: target/release/tongue-emulation.exe
      - name: Get version
        run: echo "PURPZIE_PKG_VERSION=$(cargo pkgid | cut -d "#" -f2)" >> $GITHUB_ENV
      - name: Upload to draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ env.PURPZIE_PKG_VERSION }}
          files: |
            target/release/tongue-emulation.exe
