[package]
name = "tongue-emulation"
version = "1.1.0"
description = "Emulate tongue movement in VRChat with other parts of your face"
license = "MIT"
authors = ["Purpzie"]
repository = "https://github.com/Purpzie/TongueEmulation"
include = ["src", "README.md", "LICENSE"]
edition = "2024"
publish = false

[profile.release]
codegen-units = 1
lto = true

[dependencies]
anyhow = "1.0.104"
log = {version = "0.4.33", features = ["std", "kv", "release_max_level_info"]}
rosc = "0.11.4"
tinylog = {version = "5.0.0", features = ["log", "timestamps"]}
